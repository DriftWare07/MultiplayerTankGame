name: Build Game

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure export dir exists
        run: mkdir -p build/windows
      - name: Build (Windows)
        uses: mlm-games/godot-build-action@v1.3.1
        with:
          EXPORT_PRESET_NAME: "Windows Desktop"
